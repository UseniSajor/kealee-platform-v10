name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RAILWAY_PROJECT_ID: 8187fcf6-9916-49aa-bc75-77407f83d319
  RAILWAY_ENVIRONMENT: production

jobs:
  migrate-marketing-agency:
    name: Apply marketing agency Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true pnpm install --frozen-lockfile

      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL is required"; exit 1; }
          pnpm run migrate:marketing-agency
          pnpm run migrate:intelligence-rls

  deploy-api:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build --filter=@kealee/api

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.40.0

      - name: Link Railway project
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT"

      - name: Deploy API to Railway
        run: railway redeploy --service kealee-platform-v10 --yes

  deploy-services:
    name: Deploy ${{ matrix.service }} to Railway
    needs: migrate-marketing-agency
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - portal-owner
          - portal-contractor
          - portal-developer
          - command-center
          - web-main
          - marketing-cron-lead-scoring
          - marketing-cron-sequences
          - marketing-cron-requalify-cold
          - marketing-cron-parcel-enrichment
          - marketing-cron-parcel-outreach
          - marketing-cron-marketing-drip
          # admin-console: orphaned on Railway (merged into os-admin on Vercel) — disable in dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.40.0

      - name: Link Railway project
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT"

      - name: Deploy ${{ matrix.service }} to Railway
        run: railway redeploy --service "${{ matrix.service }}" --yes
