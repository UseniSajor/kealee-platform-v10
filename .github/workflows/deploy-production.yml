name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy-api:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true pnpm install --no-frozen-lockfile

      - name: Build API
        run: pnpm build --filter=@kealee/api

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.40.0

      - name: Deploy API to Railway
        run: railway redeploy --service api --yes

  deploy-services:
    name: Deploy ${{ matrix.service }} to Railway
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - portal-owner
          - portal-contractor
          - portal-developer
          - command-center
          - web-main
          - marketing-cron-lead-scoring
          - marketing-cron-sequences
          - marketing-cron-requalify-cold
          - marketing-cron-parcel-enrichment
          - marketing-cron-parcel-outreach
          - marketing-cron-marketing-drip
          # admin-console: orphaned on Railway (merged into os-admin on Vercel) — disable in dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.40.0

      - name: Deploy ${{ matrix.service }} to Railway
        run: railway redeploy --service "${{ matrix.service }}" --yes
