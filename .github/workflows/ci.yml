name: Kealee Platform CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

jobs:
  ci:
    name: Build, Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Schema Validation
        run: |
          # Validate and verify the database schema setup
          pnpm --filter @kealee/database run schema:validate || npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Build Monorepo (includes tsc typechecks)
        run: pnpm build

      - name: Lint Check
        run: pnpm lint

      - name: TypeScript Typecheck
        run: |
          pnpm exec tsc --noEmit --project packages/automation/tsconfig.json
          pnpm exec tsc --noEmit --project apps/web-main/tsconfig.json

      - name: Run Unit Tests
        run: pnpm test

      - name: Committed Secret Scan
        run: pnpm security:committed-secrets

      - name: Security & Dependency Scan
        run: pnpm audit --audit-level=high

      - name: Provider boundary guard
        run: pnpm platform:provider-boundaries
