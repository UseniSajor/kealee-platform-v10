[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack prepare pnpm@11.22.0 --activate && NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter command-center build"
watchPatterns = ["apps/command-center/**", "packages/**"]

[deploy]
startCommand = "cd apps/command-center && node .next/standalone/server.js"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
