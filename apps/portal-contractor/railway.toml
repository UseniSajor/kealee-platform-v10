[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack prepare pnpm@11.22.0 --activate && NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter portal-contractor build"
watchPatterns = ["apps/portal-contractor/**", "packages/**"]

[deploy]
startCommand = "cd apps/portal-contractor && node .next/standalone/server.js"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
