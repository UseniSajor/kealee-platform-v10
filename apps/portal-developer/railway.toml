[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack prepare pnpm@11.22.0 --activate && NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter portal-developer build"
watchPatterns = ["apps/portal-developer/**", "packages/**"]

[deploy]
startCommand = "cd apps/portal-developer && node .next/standalone/server.js"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
